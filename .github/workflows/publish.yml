name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.release.tag_name || inputs.tag }}
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "setuptools>=83" build pip-audit

    - name: Verify release tag matches package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        tag = os.environ["RELEASE_TAG"].removeprefix("v")
        match = re.search(r'^version = "([^"]+)"', Path("pyproject.toml").read_text(), re.MULTILINE)
        if match is None:
            raise SystemExit("Could not read project version from pyproject.toml")
        version = match.group(1)
        if tag != version:
            raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
        PY
        
    - name: Build package
      run: python -m build

    - name: Validate plugin wiring
      run: python scripts/check_plugin_package.py

    - name: Validate built wheel contents
      run: |
        python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, 'scripts/check_skill_package.py', glob.glob('dist/*.whl')[0]])"

    - name: Install built wheel
      run: |
        python -c "import glob, os, subprocess, sys; wheel = max(glob.glob('dist/*.whl'), key=os.path.getmtime); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheel])"

    - name: Validate installed skill discovery and dependencies
      run: python scripts/check_skill_installation.py --output installed-skill-smoke.json

    - name: Run release smoke tests
      run: |
        wireshark-mcp --version
        python -m wireshark_mcp.server --version
        wireshark-mcp config
        wireshark-mcp doctor
        wireshark-mcp doctor --format json
        wireshark-mcp clients
        wireshark-mcp clients --format json
        wireshark-mcp --config

    - name: Audit installed runtime
      run: pip-audit
      
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      # Note: No username/password needed if using Trusted Publishing (OIDC).
      # If using legacy token, uncomment below:
      # with:
      #   password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Notify Homebrew tap to bump formula
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Only fire when the secret is present (forks / PRs won't have it)
      if: env.TAP_TOKEN != ''
      run: |
        VERSION="$RELEASE_TAG"
        VERSION="${VERSION#v}"   # strip leading 'v' if present
        PAYLOAD="$(jq -cn --arg version "$VERSION" '{event_type:"new-release",client_payload:{version:$version}}')"
        curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer $TAP_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/bx33661/homebrew-wireshark-mcp/dispatches \
          -d "$PAYLOAD"
