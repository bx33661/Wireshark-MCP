name: CI

on:
  push:
    branches: [ "master", "main", "codex/**" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,index]
        python scripts/sync_skills.py
        python scripts/sync_skills.py --check --require-installed

    - name: Validate client plugin wiring
      run: python scripts/check_plugin_package.py

    - name: Ruff lint
      run: ruff check src/ tests/ scripts/sync_skills.py scripts/evaluate_agent_traffic.py scripts/compare_agent_traffic.py scripts/check_skill_package.py scripts/check_skill_installation.py scripts/check_agent_matrix.py scripts/check_plugin_package.py scripts/smoke_plugin_runtime.py scripts/benchmark_capture_index.py skills/tshark-cli-analysis/scripts/

    - name: Ruff format check
      run: ruff format --check src/ tests/ scripts/sync_skills.py scripts/evaluate_agent_traffic.py scripts/compare_agent_traffic.py scripts/check_skill_package.py scripts/check_skill_installation.py scripts/check_agent_matrix.py scripts/check_plugin_package.py scripts/smoke_plugin_runtime.py scripts/benchmark_capture_index.py skills/tshark-cli-analysis/scripts/

    - name: Type check
      run: mypy --package wireshark_mcp --ignore-missing-imports --no-namespace-packages

    - name: Dependency audit
      run: |
        pip install pip-audit bandit zizmor
        pip-audit

    - name: Security static analysis
      run: |
        bandit -q -r src
        zizmor --pedantic --min-severity low .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        python scripts/sync_skills.py
        python scripts/sync_skills.py --check --require-installed

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=wireshark_mcp --cov-report=term-missing --cov-fail-under=50 -v

    - name: Compile check
      run: python -m compileall src/

  integration-linux:
    name: TShark integration (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,index]
        python scripts/sync_skills.py
        python scripts/sync_skills.py --check --require-installed

    - name: Install TShark
      run: |
        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
        tshark -v

    - name: Run Linux TShark integration smoke tests
      run: |
        python tests/fixtures/generate_pcaps.py
        pytest tests/test_client.py -k "real_tshark" -v
        pytest tests/test_field_names.py -v
        pytest tests/test_real_pcap.py -v
        pytest tests/test_capture_index.py -v
        python scripts/check_skill_installation.py --require-engine --output installed-skill-smoke.json
        python -m pip install uv
        python scripts/check_plugin_package.py --build plugin-smoke.zip
        python scripts/smoke_plugin_runtime.py --plugin-zip plugin-smoke.zip --output plugin-runtime-smoke.json

  integration-windows:
    name: TShark integration (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,index]
        python scripts/sync_skills.py
        python scripts/sync_skills.py --check --require-installed

    - name: Install Wireshark CLI tools
      shell: powershell
      run: |
        choco install wireshark --version 4.6.8 --yes --no-progress
        $wiresharkDir = Join-Path ${env:ProgramFiles} "Wireshark"
        $wiresharkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $wiresharkDir "tshark.exe") -v

    - name: Run Windows TShark integration tests
      run: |
        python tests/fixtures/generate_pcaps.py
        pytest tests/test_client.py -k "real_tshark" -v
        pytest tests/test_field_names.py -v
        pytest tests/test_real_pcap.py -v
        pytest tests/test_capture_index.py -v
        python scripts/check_skill_installation.py --require-engine --output installed-skill-smoke.json
        wireshark-mcp doctor --format json

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Validate packaged skill files
      run: |
        python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, 'scripts/check_skill_package.py', glob.glob('dist/*.whl')[0]])"

    - name: Install built wheel
      run: |
        python -c "import glob, os, subprocess, sys; wheel = max(glob.glob('dist/*.whl'), key=os.path.getmtime); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheel])"

    - name: Validate installed skill discovery and dependencies
      run: python scripts/check_skill_installation.py --output installed-skill-smoke.json

    - name: Run packaged CLI smoke tests
      run: |
        wireshark-mcp --version
        python -m wireshark_mcp.server --version
        wireshark-mcp config
        wireshark-mcp doctor
        wireshark-mcp doctor --format json
        wireshark-mcp clients
        wireshark-mcp clients --format json
        wireshark-mcp --config
