name: CI

on:
  push:
    branches: [ "master", "main", "codex/**" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Ruff lint
      run: ruff check src/ tests/

    - name: Ruff format check
      run: ruff format --check src/ tests/

    - name: Type check
      run: mypy --package wireshark_mcp --ignore-missing-imports --no-namespace-packages

    - name: Dependency audit
      run: |
        pip install pip-audit bandit zizmor
        pip-audit

    - name: Security static analysis
      run: |
        bandit -q -r src
        zizmor --pedantic --min-severity low .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=wireshark_mcp --cov-report=term-missing --cov-fail-under=50 -v

    - name: Compile check
      run: python -m compileall src/

  integration-linux:
    name: TShark integration (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Install TShark
      run: |
        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
        tshark -v

    - name: Run Linux TShark integration smoke tests
      run: |
        python tests/fixtures/generate_pcaps.py
        pytest tests/test_client.py -k "real_tshark" -v
        pytest tests/test_field_names.py -v
        pytest tests/test_real_pcap.py -v

  integration-windows:
    name: TShark integration (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Install Wireshark CLI tools
      shell: powershell
      run: |
        choco install wireshark --version 4.6.8 --yes --no-progress
        $wiresharkDir = Join-Path ${env:ProgramFiles} "Wireshark"
        $wiresharkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $wiresharkDir "tshark.exe") -v

    - name: Run Windows TShark integration tests
      run: |
        python tests/fixtures/generate_pcaps.py
        pytest tests/test_client.py -k "real_tshark" -v
        pytest tests/test_field_names.py -v
        pytest tests/test_real_pcap.py -v
        wireshark-mcp doctor --format json

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Validate packaged skill files
      run: |
        python -c "import glob, os, zipfile; wheel = max(glob.glob('dist/*.whl'), key=os.path.getmtime); names = set(zipfile.ZipFile(wheel).namelist()); assert any(name.endswith('wireshark_mcp/skills/wireshark-traffic-analysis/SKILL.md') for name in names), 'Skill package missing from wheel'"

    - name: Install built wheel
      run: |
        python -c "import glob, os, subprocess, sys; wheel = max(glob.glob('dist/*.whl'), key=os.path.getmtime); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheel])"

    - name: Run packaged CLI smoke tests
      run: |
        wireshark-mcp --version
        python -m wireshark_mcp.server --version
        wireshark-mcp config
        wireshark-mcp doctor
        wireshark-mcp doctor --format json
        wireshark-mcp clients
        wireshark-mcp clients --format json
        wireshark-mcp --config
