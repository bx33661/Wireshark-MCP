name: Container smoke

on:
  pull_request:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - .github/workflows/container-smoke.yml
      - .github/workflows/publish-container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Container smoke (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
          - arch: arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build locally without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: wireshark-mcp:ci

      - name: Verify architecture, CLI, TShark and non-root user
        env:
          PLATFORM: linux/${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint uname wireshark-mcp:ci -m)" = "$EXPECTED_MACHINE"
          docker run --rm --platform "$PLATFORM" wireshark-mcp:ci --version
          docker run --rm --platform "$PLATFORM" --entrypoint tshark wireshark-mcp:ci --version
          docker run --rm --platform "$PLATFORM" --entrypoint python wireshark-mcp:ci -c "import duckdb"
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint id wireshark-mcp:ci -u)" = "10001"
